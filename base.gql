enum NotificationType {
  ORDER_STATUS_CHANGED
  BACK_IN_STOCK
  PRICE_DROP
}

enum PaymentStatus {
  PENDING
  AUTHORIZED
  DECLINED
  REFUNDED
}

enum RecommendationSource {
  COLLABORATIVE_FILTERING
  CONTENT_BASED
  TRENDING
  MANUAL
}

