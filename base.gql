type Query {
  "Fetches an object given its ID."
  node("ID of the object." id: ID!): Node
  "Lookup nodes by a list of IDs."
  nodes("The list of node IDs." ids: [ID!]!): [Node]!
  inventoryItemById(id: ID!): InventoryItem
  orderById(id: ID!): Order
  paymentById(id: ID!): Payment
  productById(id: ID!): Product
  products(
    "Returns the elements in the list that come after the specified cursor."
    after: String
    "Returns the elements in the list that come before the specified cursor."
    before: String
    brand: String
    category: String
    "Returns the first _n_ elements from the list."
    first: Int
    inStockOnly: Boolean
    "Returns the last _n_ elements from the list."
    last: Int
    maxPrice: Decimal
    minPrice: Decimal
    searchText: String
  ): ProductsConnection
  recommendationById(id: ID!): Recommendation
  recommendations(
    "Returns the elements in the list that come after the specified cursor."
    after: String
    "Returns the elements in the list that come before the specified cursor."
    before: String
    "Returns the first _n_ elements from the list."
    first: Int
    "Returns the last _n_ elements from the list."
    last: Int
  ): RecommendationsConnection
  reviewById(id: ID!): Review
  userById(id: ID!): User
  userByUsername(username: String!): User
  users(
    "Returns the elements in the list that come after the specified cursor."
    after: String
    "Returns the elements in the list that come before the specified cursor."
    before: String
    "Returns the first _n_ elements from the list."
    first: Int
    "Returns the last _n_ elements from the list."
    last: Int
  ): UsersConnection
  viewer: Viewer!
}

type Mutation {
  addProductToCart(input: AddProductToCartInput!): AddProductToCartPayload!
  addToWishlist(input: WishlistItemInput!): AddToWishlistPayload!
  applyCoupon(input: ApplyCouponInput!): ApplyCouponPayload!
  cancelOrder(input: CancelOrderInput!): CancelOrderPayload!
  checkout: CheckoutPayload!
  createOrder(input: CreateOrderInput!): CreateOrderPayload!
  createPayment(input: CreatePaymentInput!): CreatePaymentPayload!
  createReview(input: CreateReviewInput!): CreateReviewPayload!
  markNotificationRead(
    input: MarkNotificationReadInput!
  ): MarkNotificationReadPayload!
  markReviewHelpful(input: MarkReviewHelpfulInput!): MarkReviewHelpfulPayload!
  moveSavedItemToCart(
    input: MoveSavedItemToCartInput!
  ): MoveSavedItemToCartPayload!
  refundPayment(input: RefundPaymentInput!): RefundPaymentPayload!
  removeFromWishlist(input: WishlistItemInput!): RemoveFromWishlistPayload!
  removeProductFromCart(
    input: RemoveProductFromCartInput!
  ): RemoveProductFromCartPayload!
  requestPasswordReset(
    input: RequestPasswordResetInput!
  ): RequestPasswordResetPayload!
  resetPassword(input: ResetPasswordInput!): ResetPasswordPayload!
  respondToReview(input: RespondToReviewInput!): RespondToReviewPayload!
  restockProduct(input: RestockProductInput!): RestockProductPayload!
  saveItemForLater(input: SaveItemForLaterInput!): SaveItemForLaterPayload!
  uploadProductPicture(
    input: UploadProductPictureInput!
  ): UploadProductPicturePayload!
}

type Subscription {
  onReviewCreated(after: String): ReviewCreated!
}

type CreateReviewPayload {
  review: Review
  errors: [CreateReviewError!]
}

type Recommendation implements Node {
  id: ID!
  product: Product!
  reason: String!
