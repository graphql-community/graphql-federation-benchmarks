type Viewer {
  cart: Cart!
}

# Every subgraph that returns an error union member must redeclare this
# interface identically; graphql-federation merges identical interface defs.
interface Error {
  message: String!
}

# Same rule as Error above: redeclare identically in each subgraph whose
# entities implement Node.
"The node interface is implemented by entities that have a global unique identifier."
interface Node {
  id: ID!
}

union CreateReviewError =
  | UnknownProductError
  | UnknownUserError
  | InvalidReviewStarsError

union AddProductToCartError =
  | ProductAmountCannotBeLowerThanOneError
  | UnknownProductError

union RemoveProductFromCartError =
  | ProductAmountCannotBeLowerThanOneError
  | ProductNotInCartError

union ApplyCouponError = UnknownCartError | InvalidCouponError

union SaveItemForLaterError = UnknownCartItemError

union MoveSavedItemToCartError = UnknownCartItemError

union CreateOrderError =
  | UnknownUserError
  | UnknownProductError
  | ProductAmountCannotBeLowerThanOneError
  | EmptyOrderError

union CancelOrderError = UnknownOrderError | OrderCannotBeCancelledError

union CreatePaymentError =
  | UnknownOrderError
  | UnknownPaymentMethodError
  | PaymentDeclinedError

union RefundPaymentError =
  | UnknownPaymentError
  | PaymentCannotBeRefundedError
  | InvalidRefundAmountError

union MarkNotificationReadError = UnknownNotificationError

union RestockProductError =
  | UnknownProductError
  | ProductAmountCannotBeLowerThanOneError

union MarkReviewHelpfulError = UnknownReviewError

union RespondToReviewError = UnknownReviewError

union UploadProductPictureError = UnknownProductError

